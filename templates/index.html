<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing URL Detector</title>

    <style>


* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #101827;
    color: white;
    text-align: center;
    padding: 16px 24px;
    margin: 0;
}

h1 {
    color: #38bdf8;
    margin: 8px 0;
}

body > p {
    margin: 6px 0 16px;
}

input {
    width: 60%;
    max-width: 650px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #475569;
    background-color: #1e293b;
    color: white;
    font-size: 16px;
}

button {
    padding: 12px 22px;
    margin-left: 8px;
    border: none;
    border-radius: 8px;
    background-color: #0284c7;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: #0369a1;
}

#result {
    max-width: 850px;
    margin: 18px auto;
    padding: 16px 20px;
    background-color: #1e293b;
    border-radius: 12px;
    text-align: left;
    overflow-wrap: anywhere;
}

#result h2 {
    margin: 0 0 10px;
    color: #38bdf8;
}

#result p {
    margin: 8px 0;
}

.risk-score {
    font-size: 36px;
    font-weight: bold;
    margin: 6px 0;
}

.risk-level {
    font-size: 17px;
    font-weight: bold;
}

.risk-reasons {
    margin-top: 12px;
    line-height: 1.6;
}

.risk-reasons h3 {
    margin: 8px 0;
}

.risk-reasons ul {
    margin: 4px 0;
    padding-left: 22px;
}

.risk-reasons li {
    color: #fbbf24;
}

@media (max-width: 650px) {
    body {
        padding: 14px;
    }

    input {
        width: 100%;
    }

    button {
        margin: 10px 0 0;
    }

    #result {
        padding: 14px;
    }
}




</style>

</head>

<body>

    <h1>Phishing URL Detector</h1>

    <p>Check whether a URL is potentially malicious.</p>

    <input
        type="text"
        id="urlInput"
        placeholder="Enter URL to analyse"
    >

    <button onclick="analyzeURL()">Analyse URL</button>

    <div id="result"></div>

<script>

    function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}
async function analyzeURL() {

    const url = document.getElementById("urlInput").value.trim();
    const resultDiv = document.getElementById("result");

    if (!url) {
        resultDiv.textContent = "Please enter a URL.";
        return;
    }

    resultDiv.textContent = "Analyzing...";

    try {
        const response = await fetch("/analyze", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ url: url })
        });

        const data = await response.json();

        if (!response.ok) {
            resultDiv.textContent = data.error;
            return;
        }

        const risk = data.risk_assessment;
const analysis = data.analysis;

const riskColor = risk.score > 50
    ? "#ef4444"
    : risk.score > 20
    ? "#fbbf24"
    : "#22c55e";

const reasons = risk.reasons.length
    ? risk.reasons.map(reason => `<li>${escapeHTML(reason)}</li>`).join("")
    : "<li>No suspicious indicators detected.</li>";

resultDiv.innerHTML = `
    <h2>Scan Results</h2>

    <p>Scanned URL: ${escapeHTML(analysis.url)}</p>

    <div class="risk-score" style="color: ${riskColor}">
    ${risk.score}/100
</div>


<div style="position: relative; width: 100%; height: 12px; background-color: #334155; border-radius: 10px; margin: 15px 0; overflow: hidden;">
    <div style="position: absolute; top: 0; left: 0; width: ${risk.score}%; height: 100%; background-color: ${riskColor}; border-radius: 10px; transition: width 0.5s ease;">
    </div>
</div>


    <div class="risk-level" style="color: ${riskColor}">
        ${escapeHTML(risk.level)}
    </div>

    <div class="risk-reasons">
        <h3>Detection Reasons</h3>
        <ul>${reasons}</ul>
    </div>
`;

    } catch (error) {
        resultDiv.textContent = "Unable to connect to the server.";
    }
}
</script>

</body>
</html>
